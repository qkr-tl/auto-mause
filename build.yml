          mkdir -p app/src/main/java/com/example/automouse
          cat > app/src/main/java/com/example/automouse/ClickService.kt <<'AM_EOF_2'
          package com.example.automouse

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.WindowManager.LayoutParams as LP
          import android.view.accessibility.AccessibilityEvent
          import android.widget.LinearLayout
          import android.widget.TextView

          class ClickService : AccessibilityService() {
              private lateinit var wm: WindowManager
              private val h = Handler(Looper.getMainLooper())
              private val marks = ArrayList<TextView>()
              private var panel: LinearLayout? = null
              private var startBtn: TextView? = null
              private var running = false
              private var idx = 0
              private var cnt = 0
              private var round = 0

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onServiceConnected() {
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  buildPanel()
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() { stopRun() }

              override fun onDestroy() {
                  h.removeCallbacksAndMessages(null)
                  if (::wm.isInitialized) {
                      marks.forEach { runCatching { wm.removeView(it) } }
                      panel?.let { runCatching { wm.removeView(it) } }
                  }
                  super.onDestroy()
              }

              private fun lp(x: Int, y: Int): LP {
                  val f = LP.FLAG_NOT_FOCUSABLE or LP.FLAG_LAYOUT_NO_LIMITS or LP.FLAG_LAYOUT_IN_SCREEN
                  return LP(LP.WRAP_CONTENT, LP.WRAP_CONTENT, LP.TYPE_ACCESSIBILITY_OVERLAY, f, PixelFormat.TRANSLUCENT).apply {
                      gravity = Gravity.TOP or Gravity.START
                      this.x = x
                      this.y = y
                  }
              }

              private fun drag(v: View, p: LP) {
                  var dx = 0f; var dy = 0f; var sx = 0; var sy = 0
                  v.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { dx = e.rawX; dy = e.rawY; sx = p.x; sy = p.y }
                          MotionEvent.ACTION_MOVE -> {
                              p.x = sx + (e.rawX - dx).toInt()
                              p.y = sy + (e.rawY - dy).toInt()
                              wm.updateViewLayout(v, p)
                          }
                      }
                      true
                  }
              }

              private fun buildPanel() {
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(dp(6), dp(6), dp(6), dp(6))
                      background = GradientDrawable().apply {
                          cornerRadius = dp(14).toFloat()
                          setColor(0xE6162330.toInt())
                      }
                  }
                  fun btn(label: String, onClick: () -> Unit) = TextView(this).apply {
                      text = label; textSize = 20f; setTextColor(Color.WHITE); gravity = Gravity.CENTER
                      setPadding(dp(12), dp(8), dp(12), dp(8))
                      setOnClickListener { onClick() }
                  }
                  val handle = btn("≡") {}
                  val sb = btn("▶") { toggle() }
                  startBtn = sb
                  box.addView(handle)
                  box.addView(btn("＋") { if (!running) addMark() })
                  box.addView(btn("－") { if (!running) delMark() })
                  box.addView(sb)
                  box.addView(btn("⚙") {
                      startActivity(Intent(this, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                  })
                  val p = lp(dp(8), dp(80))
                  drag(handle, p)
                  wm.addView(box, p)
                  panel = box
              }

              private fun addMark() {
                  val n = marks.size
                  val t = TextView(this).apply {
                      text = "${n + 1}"; textSize = 18f; setTextColor(Color.BLACK); gravity = Gravity.CENTER
                      minWidth = dp(52); minHeight = dp(52)
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(0xCCF2A900.toInt())
                          setStroke(dp(3), Color.WHITE)
                      }
                  }
                  val p = lp(dp(120) + dp(24) * (n % 10), dp(240) + dp(64) * (n % 10))
                  t.tag = p
                  drag(t, p)
                  wm.addView(t, p)
                  marks.add(t)
              }

              private fun delMark() {
                  if (marks.isEmpty()) return
                  wm.removeView(marks.removeAt(marks.size - 1))
              }

              private fun setTouch(on: Boolean) {
                  marks.forEach {
                      val p = it.tag as LP
                      p.flags = if (on) p.flags and LP.FLAG_NOT_TOUCHABLE.inv() else p.flags or LP.FLAG_NOT_TOUCHABLE
                      wm.updateViewLayout(it, p)
                  }
              }

              private fun toggle() { if (running) stopRun() else startRun() }

              private fun startRun() {
                  if (marks.isEmpty()) return
                  running = true; idx = 0; cnt = 0; round = 0
                  startBtn?.text = "■"
                  setTouch(false)
                  h.postDelayed({ step() }, 300)
              }

              private fun stopRun() {
                  running = false
                  h.removeCallbacksAndMessages(null)
                  startBtn?.text = "▶"
                  if (::wm.isInitialized) setTouch(true)
              }

              private fun step() {
                  if (!running) return
                  if (idx >= marks.size) { stopRun(); return }
                  val sp = getSharedPreferences("cfg", MODE_PRIVATE)
                  val gap = (sp.getFloat("gap", 0.1f) * 1000).toLong().coerceAtLeast(30)
                  val rep = sp.getInt("rep", 0)
                  val rr = sp.getBoolean("rr", true)
                  val per = sp.getInt("per", 5).coerceAtLeast(1)

                  val m = marks[idx]
                  val loc = IntArray(2)
                  m.getLocationOnScreen(loc)
                  val path = Path().apply { moveTo(loc[0] + m.width / 2f, loc[1] + m.height / 2f) }
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 20))
                      .build()
                  dispatchGesture(g, null, null)

                  var next = true
                  if (!rr) {
                      cnt++
                      if (cnt < per) next = false else cnt = 0
                  }
                  if (next) {
                      idx++
                      if (idx >= marks.size) {
                          idx = 0
                          round++
                          if (rep > 0 && round >= rep) {
                              h.postDelayed({ stopRun() }, 60)
                              return
                          }
                      }
                  }
                  h.postDelayed({ step() }, gap)
              }
          }
          AM_EOF_2
          mkdir -p app/src/main/java/com/example/automouse
          cat > app/src/main/java/com/example/automouse/MainActivity.kt <<'AM_EOF_3'
          package com.example.automouse

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.widget.*

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val sp = getSharedPreferences("cfg", MODE_PRIVATE)
                  val pad = (16 * resources.displayMetrics.density).toInt()
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad * 2, pad, pad)
                  }
                  fun tv(t: String) = TextView(this).apply { text = t; setPadding(0, pad / 2, 0, pad / 4) }
                  fun num(v: String, dec: Boolean) = EditText(this).apply {
                      setText(v)
                      inputType = InputType.TYPE_CLASS_NUMBER or (if (dec) InputType.TYPE_NUMBER_FLAG_DECIMAL else 0)
                  }
                  val gap = num(sp.getFloat("gap", 0.1f).toString(), true)
                  val rep = num(sp.getInt("rep", 0).toString(), false)
                  val per = num(sp.getInt("per", 5).toString(), false)
                  val rr = Switch(this).apply {
                      text = "한 번씩 돌려가며 클릭 (1→2→3 반복)"
                      isChecked = sp.getBoolean("rr", true)
                  }
                  col.addView(tv("1) 접근성에서 '오토마우스'를 켜면 화면에 조작 패널이 떠요.\n2) ＋로 지점을 추가하고, 번호를 클릭할 자리로 끌어다 놓으세요.\n3) ▶ 시작, ■ 정지."))
                  col.addView(Button(this).apply {
                      text = "접근성 설정 열기"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  })
                  col.addView(tv("클릭 간격 (초, 최소 0.03)")); col.addView(gap)
                  col.addView(tv("전체 반복 횟수 (0은 무한)")); col.addView(rep)
                  col.addView(rr)
                  col.addView(tv("지점당 클릭 횟수 (돌려가며 끄면 적용)")); col.addView(per)
                  col.addView(Button(this).apply {
                      text = "저장"
                      setOnClickListener {
                          sp.edit()
                              .putFloat("gap", gap.text.toString().toFloatOrNull() ?: 0.1f)
                              .putInt("rep", rep.text.toString().toIntOrNull() ?: 0)
                              .putInt("per", per.text.toString().toIntOrNull() ?: 5)
                              .putBoolean("rr", rr.isChecked)
                              .apply()
                          Toast.makeText(this@MainActivity, "저장했어요", Toast.LENGTH_SHORT).show()
                      }
                  })
                  setContentView(ScrollView(this).apply { addView(col) })
              }
          }
          AM_EOF_3
